<script>'use strict';
const TITLES=['Сначала видео','Тема урока','Одно целое','Правильная дробь','Неправильная дробь','Смешанное число','В неправильную дробь','В смешанное число','Особые случаи','Проверь себя','Коротко о главном'];
const C={teal:'#138573',purple:'#6b55b5',orange:'#e87949',ink:'#233c41',empty:'#e8eee5'};
const S={slide:0,video:0,unit:{d:4,filled:false},proper:{n:3,d:4},improper:{n:7,d:4},mixed:{q:2,r:3,d:4},forward:{q:2,r:3,d:4,step:0},reverse:{n:11,d:4,step:0,error:''},special:'whole',specialStep:0,practice:{index:0,done:[false,false,false,false],messages:['','','',''],kinds:['','','',''],answers:[null,null,null,null]},playing:null};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
function frac(n,d,cls=''){return `<span class="frac ${cls}" role="math" aria-label="${esc(n)} делить на ${esc(d)}"><span class="num">${n}</span><span class="den">${d}</span></span>`;}
function mixed(q,r,d,{color=false}={}){if(r===0)return `<span class="whole ${color?'teal':''}">${q}</span>`;if(q===0)return frac(r,d);return `<span class="mixed" role="math" aria-label="${q} целых и ${r} делить на ${d}"><span class="whole ${color?'teal':''}">${q}</span>${frac(r,d,color?'orange':'')}</span>`;}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a;}
function doleWord(n){return n%100>=11&&n%100<=14?'долей':n%10===1?'доля':n%10>=2&&n%10<=4?'доли':'долей';}
function decompose(n,d){return {q:Math.floor(n/d),r:n%d,d};}
function notation(n,d){const {q,r}=decompose(n,d);return mixed(q,r,d);}
function note(text){return `<aside class="note-strip" aria-label="Запиши в тетрадь"><div class="note-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 4H4v17h15v-3M8 4h7M8 8h4M8 16l3-1 9-9-2-2-9 9-1 3Z"/></svg><span>ЗАПИШИ<br> В ТЕТРАДЬ</span></div><div class="note-content">${text}</div></aside>`;}
function head(k,title){return `<div class="eyebrow">${String(S.slide+1).padStart(2,'0')} / ${k}</div><h2 id="slideTitle" tabindex="-1">${title}</h2>`;}
function page(content,notebook){return `<div class="lesson-body">${content}</div>${note(notebook)}`;}
function pie(n,d,{color=C.teal,animate=false}={}){let s=`<svg class="pie" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Закрашено ${n} из ${d} равных частей">`;for(let i=0;i<d;i++){const a=-Math.PI/2+2*Math.PI*i/d,b=-Math.PI/2+2*Math.PI*(i+1)/d;const x1=150+129*Math.cos(a),y1=150+129*Math.sin(a),x2=150+129*Math.cos(b),y2=150+129*Math.sin(b);const fill=i<n?color:C.empty;s+=`<path d="M150 150 L${x1.toFixed(5)} ${y1.toFixed(5)} A129 129 0 0 1 ${x2.toFixed(5)} ${y2.toFixed(5)}Z" fill="${fill}" stroke="#fffefb" stroke-width="2.2" ${animate&&i<n?`class="model-fill" style="animation-delay:${i*.13}s"`:''}/>`;}return s+'<circle cx="150" cy="150" r="130" fill="none" stroke="#b6cbbc" stroke-width="2"/></svg>';}
function line(n,d,max=1){const start=27,end=453,y=33,x=start+(end-start)*n/(d*max);let out=`<svg class="numberline" viewBox="0 0 480 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="На числовой прямой отмечено число ${n} делить на ${d}"><line x1="${start}" x2="${end}" y1="${y}" y2="${y}" stroke="#9eb6a7" stroke-width="2"/>`;for(let i=0;i<=max;i++){const tx=start+(end-start)*i/max;out+=`<line x1="${tx}" x2="${tx}" y1="26" y2="40" stroke="#657e70" stroke-width="2"/><text x="${tx}" y="63" text-anchor="middle" fill="#233c41" font-family="Arial" font-size="18">${i}</text>`;}out+=`<circle cx="${x}" cy="${y}" r="6" fill="${C.teal}"/><path d="M${x-5} 12L${x} 21L${x+5} 12" fill="${C.teal}"/></svg>`;return out;}
function positions(n,d,layout){const cw=240/d,cols=Math.floor(552/(cw+8));return Array.from({length:n},(_,i)=>{const g=Math.floor(i/d),slot=i%d;return layout==='loose'?{x:24+(i%cols)*(cw+8),y:43+Math.floor(i/cols)*70}:{x:24+(g%2)*312+slot*cw,y:48+Math.floor(g/2)*116};});}
function pieceModel(n,d,{layout='grouped',split=true,from=null,colorMode='parts',labels=true,caption='Каждая рамка — одно целое.'}={}){
 const parts=positions(n,d,layout),orig=from?positions(n,d,from):null,cw=240/d,h=44,groups=Math.ceil(n/d),q=Math.floor(n/d);
 const viewHeight=Math.max(...parts.map(p=>p.y+h),...(orig||[]).map(p=>p.y+h))+54;
 let s=`<svg class="segment-demo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 ${viewHeight}" role="img" aria-label="${n} долей, каждая равна одной ${d}-й целого. ${q} целых и ${n%d} долей в остатке.">`;
 if(layout==='grouped')for(let g=0;g<groups;g++){const x=24+(g%2)*312,y=48+Math.floor(g/2)*116,full=g<q;s+=`<g ${from?'class="target-frame"':''}><rect x="${x}" y="${y}" width="240" height="44" rx="2" fill="${C.empty}"/><text x="${x}" y="${y-13}" fill="#627274" font-family="Arial" font-size="15">${full?'1 целое':n%d+' '+doleWord(n%d)+' из '+d}</text></g>`;}
 for(let i=0;i<n;i++){const {x,y}=parts[i],group=Math.floor(i/d),fill=colorMode==='single'?C.teal:(group<q?C.teal:C.orange);const moving=from&&from!==layout;const delay=Math.min(i*.022,.44),style=moving?`class="moving-part" style="--dx:${orig[i].x-x}px;--dy:${orig[i].y-y}px;--delay:${delay}s"`:'';
 s+=`<g ${style}><rect class="fraction-piece" data-piece="${i}" x="${x}" y="${y}" width="${cw}" height="${h}" fill="${fill}" ${split||layout==='loose'?'stroke="#fffefb" stroke-width="1.5"':''}/>`;
 if(labels&&(split||layout==='loose')){const cx=x+cw/2;s+=`<g class="part-label" style="--label-delay:${moving?delay+.7:.1}s" fill="${fill===C.orange?'#512b18':'#ffffff'}" font-family="Arial" text-anchor="middle" font-size="14"><text x="${cx}" y="${y+16}">1</text><line x1="${cx-8}" x2="${cx+8}" y1="${y+22}" y2="${y+22}" stroke="${fill===C.orange?'#512b18':'#ffffff'}" stroke-width="1"/><text x="${cx}" y="${y+36}">${d}</text></g>`;}s+='</g>';}
 if(layout==='grouped')for(let g=0;g<groups;g++){const x=24+(g%2)*312,y=48+Math.floor(g/2)*116;s+=`<rect x="${x}" y="${y}" width="240" height="44" fill="none" stroke="#8eaa99" stroke-width="1.3" ${from?'class="target-frame"':''}/>`;if(split)for(let j=1;j<d;j++){const xx=x+j*cw;s+=`<line class="segment-line" x1="${xx}" x2="${xx}" y1="${y}" y2="${y+44}" stroke="#fffefb" stroke-width="1.1" style="--delay:${j*.03}s"/>`;}}
 s+=`<text x="300" y="${viewHeight-15}" text-anchor="middle" font-family="Arial" font-size="14" fill="#627274">${esc(caption)}</text></svg>`;return s;
}
function denomControls(d,action){return `<div class="chip-row">${[2,3,4,5,6,8].map(x=>`<button class="chip ${d===x?'active':''}" data-action="${action}" data-d="${x}" data-focus="${action}-${x}" aria-pressed="${d===x}">${x}</button>`).join('')}</div>`;}
function stepper(value,min,max,action,label){return `<div class="count-control"><span class="stepper-label">${label}</span><div class="stepper"><button data-action="${action}" data-change="-1" data-focus="${action}-minus" aria-label="Уменьшить: ${label}" ${value<=min?'disabled':''}>−</button><output>${value}</output><button data-action="${action}" data-change="1" data-focus="${action}-plus" aria-label="Увеличить: ${label}" ${value>=max?'disabled':''}>+</button></div></div>`;}
function mixedControls(a,key){return `<div class="three-controls"><label>Целая часть<select class="control-select" data-control="${key}-q" data-focus="${key}-q" aria-label="Целая часть">${[1,2,3].map(x=>`<option value="${x}" ${a.q===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Числитель<select class="control-select" data-control="${key}-r" data-focus="${key}-r" aria-label="Числитель дробной части">${Array.from({length:a.d-1},(_,i)=>i+1).map(x=>`<option value="${x}" ${a.r===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Знаменатель<select class="control-select" data-control="${key}-d" data-focus="${key}-d" aria-label="Знаменатель дробной части">${[2,3,4,5,6,8].map(x=>`<option value="${x}" ${a.d===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`;}
function fractionChoices(items,state,action){return `<div class="chip-row fraction-pills">${items.map(([n,d])=>`<button class="chip ${state.n===n&&state.d===d?'active':''}" data-action="${action}" data-n="${n}" data-d="${d}" data-focus="${action}-${n}-${d}" aria-pressed="${state.n===n&&state.d===d}">${frac(n,d)}</button>`).join('')}</div>`;}
function seqControls(kind,step){return `<div class="animate-controls"><button class="button" data-action="play" data-kind="${kind}" data-focus="play-${kind}">${S.playing===kind?'Ⅱ Пауза':'▶ Анимация'}</button><div class="sequence-dots" aria-label="Шаги преобразования">${[0,1,2,3].map(i=>`<button class="seq-dot ${step===i?'current':step>i?'done':''}" data-action="seq-go" data-kind="${kind}" data-step="${i}" aria-label="Шаг преобразования ${i+1}" aria-pressed="${step===i}">${i+1}</button>`).join('')}</div><button class="quiet" data-action="seq-next" data-kind="${kind}" data-focus="seq-next-${kind}">${step===3?'Сначала ↺':'Шаг →'}</button></div>`;}
function intro(){return page(`<div class="split"><div><div class="eyebrow">Увидеть · понять · записать</div><h1 id="slideTitle" tabindex="-1">Правильные<br>и неправильные<br>дроби.<span class="title-secondary">Смешанные числа.</span></h1><p class="lesson-topic">Перевод смешанного числа<br>в неправильную дробь и обратно.</p></div><div class="panel intro-visual"><div class="model-top"><strong>Одна величина — две записи</strong></div><div class="whole-tray">${pie(4,4)}${pie(4,4)}${pie(3,4,{color:C.orange})}</div><div class="math-row">${mixed(2,3,4,{color:true})}<span class="operator">=</span>${frac(11,4)}</div><p class="demo-caption">Два целых и три четвёртых — одиннадцать четвёртых.</p></div></div>`,`<strong>Тема:</strong> правильные и неправильные дроби. Смешанные числа.<br>Перевод смешанного числа в неправильную дробь и обратно.`);}
function unit(){const {d,filled}=S.unit;return page(`<div class="split"><div>${head('Вспомним целое','Все доли вместе —<br>одно целое.')}<p class="lead">Разделим целое на <strong class="purple">${d}</strong> равных частей. Если взять все <strong class="teal">${d}</strong> частей, снова получим целое.</p><div class="control-block"><span class="label">На сколько частей разделим?</span>${denomControls(d,'unit-d')}</div><div class="buttons"><button class="button" data-action="unit-fill" data-focus="unit-fill">${filled?'Повторить анимацию':'Собрать целое'} ${arrow()}</button></div></div><div class="panel"><div class="model-top"><strong>Каждая доля — ${frac(1,d)}</strong><span class="kind-badge">1 круг = 1 целое</span></div><div class="pie-compare">${pie(filled?d:0,d,{animate:filled})}<div class="compare-math">${filled?`${frac(d,d)} = 1`:'?'}</div></div><p class="compare-description">${filled?'Взяли столько частей, сколько было всего.':'Нажми «Собрать целое».'}</p></div></div>`,`Если числитель равен знаменателю, дробь равна 1: <span class="note-inline">${frac(d,d)} = 1.</span>`);}
function proper(){const {n,d}=S.proper;return page(`<div class="split"><div>${head('Правильная дробь','Числитель меньше<br>знаменателя.')}<p class="lead">Взяли меньше частей, чем нужно для одного целого.</p><div class="rule"><strong>${n} &lt; ${d}</strong> → дробь <strong>правильная</strong>.<br>Она всегда меньше 1.</div><div class="control-block"><span class="label">Знаменатель</span>${denomControls(d,'proper-d')}</div><div class="control-block">${stepper(n,1,d-1,'proper-n','Числитель')}</div></div><div class="panel"><div class="model-top"><strong>Целое заполнено не полностью</strong><span class="kind-badge">Правильная</span></div><div class="pie-compare">${pie(n,d,{animate:true})}<div class="compare-math">${frac(n,d)} &lt; 1</div></div>${line(n,d,1)}</div></div>`,`<strong>Правильная дробь:</strong> числитель меньше знаменателя. Правильная дробь меньше 1.<br><span class="note-inline">${frac(n,d)} — правильная, так как ${n} &lt; ${d}; ${frac(n,d)} &lt; 1.</span>`);}
function improper(){const {n,d}=S.improper,q=Math.floor(n/d);return page(`<div class="split"><div>${head('Неправильная дробь','Числитель больше<br>знаменателя или равен ему.')}<p class="lead">Долей хватает на одно целое или больше.</p><div class="rule peach"><strong>${n} ${n===d?'=':'>'} ${d}</strong> → дробь <strong>неправильная</strong>.<br>Она равна 1 или больше 1.</div><div class="control-block"><span class="label">Меняй числитель, знаменатель равен ${d}</span>${stepper(n,d,4*d,'improper-n','Долей')}</div><div class="control-block">${fractionChoices([[4,4],[7,4],[9,4],[12,4]],S.improper,'improper-preset')}</div></div><div class="panel"><div class="model-top"><strong>${n===d?'Ровно одно целое':`Поместилось целых: ${q}`}</strong><span class="kind-badge orange-badge">Неправильная</span></div>${pieceModel(n,d,{labels:false,colorMode:'single'})}<div class="math-row below-math">${frac(n,d)}<span class="operator">${n===d?'=':'>'}</span>1</div></div></div>`,`<strong>Неправильная дробь:</strong> числитель больше знаменателя или равен ему. Такая дробь ≥ 1.<br><span class="note-inline">${frac(n,d)} — неправильная, так как ${n} ${n===d?'=':'>'} ${d}. В частности, ${frac(d,d)} = 1.</span>`);}
function mixedSlide(){const a=S.mixed,n=a.q*a.d+a.r;return page(`<div class="split"><div>${head('Смешанное число','Целая часть<br>и дробная часть.')}<p class="lead">Смешанное число — сумма <strong class="teal">целого числа</strong> и <strong class="orange">правильной дроби</strong>.</p><div class="math-row left" style="margin:19px 0">${mixed(a.q,a.r,a.d,{color:true})}<span class="operator">=</span><span class="teal">${a.q}</span><span class="operator">+</span>${frac(a.r,a.d,'orange')}</div><div class="control-block"><span class="label">Составь смешанное число</span>${mixedControls(a,'mixed')}</div><div class="transition-note">${a.r} &lt; ${a.d}: дробная часть меньше 1.<br>Между целой частью и дробью знак «+» не пишут.</div></div><div class="panel"><div class="model-top"><strong>Целые — зелёные, остаток — оранжевый</strong></div>${pieceModel(n,a.d,{labels:false})}<div class="math-row below-math">${mixed(a.q,a.r,a.d,{color:true})}</div></div></div>`,`<strong>Смешанное число</strong> состоит из целой части и правильной дробной части.<br><span class="note-inline">${mixed(a.q,a.r,a.d)} = ${a.q} + ${frac(a.r,a.d)}.</span>`);}
function forward(){const a=S.forward,{q,r,d,step}=a,wholeParts=q*d,n=wholeParts+r;const statuses=[`Начинаем с ${q} целых и ${r} долей.`,`${q} × ${d} = ${wholeParts} долей в целых.`,`${wholeParts} + ${r} = ${n} долей всего.`,`${mixed(q,r,d)} = ${frac(`${q} × ${d} + ${r}`,d)} = ${frac(n,d)}`];const steps=[`В целых: ${q} × ${d} = ${wholeParts} долей.`,`Добавим ещё ${r}: ${wholeParts} + ${r} = ${n}.`,`Знаменатель ${d} оставим прежним.`];return page(`<div class="split wide-visual"><div>${head('Перевод в неправильную дробь','Считаем все доли.')}<p class="lead">В каждом целом — <strong class="purple">${d}</strong> долей. Сначала посчитаем доли в целых, потом добавим дробную часть.</p><ol class="algorithm">${steps.map((t,i)=>`<li class="${step===i+1?'active':step>i+1?'done':''}"><span class="step-num">${i+1}</span><span>${t}</span></li>`).join('')}</ol><div class="control-block"><span class="label">Измени пример</span>${mixedControls(a,'forward')}</div></div><div class="panel"><div class="model-top"><strong>${step<2?'Разбиваем целые на доли':'Все доли одинакового размера'}</strong><span class="label">Одна доля — ${frac(1,d)}</span></div>${pieceModel(n,d,{layout:step>=2?'loose':'grouped',split:step>=1,from:step===2?'grouped':null,labels:step>=1,caption:step<2?'Каждая рамка — одно целое.':`${n} отдельных долей. Размер каждой доли не изменился.`})}<div class="animation-stage ${step===3?'result':''}" role="status">${statuses[step]}</div>${seqControls('forward',step)}</div></div>`,`<strong>В неправильную дробь:</strong> целую часть умножь на знаменатель, прибавь числитель. Знаменатель оставь прежним.<br><span class="note-inline">${mixed(q,r,d)} = ${frac(`${q} × ${d} + ${r}`,d)} = ${frac(n,d)}.</span>`);}
function reverse(){
 const a=S.reverse,{n,d,step}=a,{q,r}=decompose(n,d),full=q*d,final=mixed(q,r,d);
 const statuses=[`Сколько целых получится из ${n} долей?`,`${q} × ${d} = ${full}: собрали ${q} ${q===1?'целое':'целых'}.`,`${n} − ${full} = ${r}: ${r===0?'долей не осталось.':'осталось '+r+' '+doleWord(r)+'.'}`,`${frac(n,d)} = ${final}`];
 const steps=[
  `<strong>Найди целую часть.</strong><br>${n} : ${d} = ${q} (ост. ${r}). Это ${q} ${q===1?'полная группа':'полные группы'} по ${d} ${doleWord(d)}.`,
  `<strong>Найди остаток.</strong><br>${n} − ${q} × ${d} = ${r}. ${r===0?'Все доли собраны в целые.':'Это числитель дробной части.'}`,
  r===0?'<strong>Запиши целое число.</strong><br>Остаток равен нулю — дробной части нет.':`<strong>Знаменатель оставь прежним.</strong><br>Доли остались ${d===2?'половинами':d===3?'третями':d===4?'четвертями':'теми же'}, поэтому внизу пишем ${d}.`
 ];
 return page(`<div class="split wide-visual"><div>${head('Перевод в смешанное число','Собираем целые.<br>Остаток — в дробь.')}<p class="reverse-lead">В дроби ${frac(n,d)} всего <strong>${n} ${doleWord(n)}</strong>. Каждые <strong>${d} ${doleWord(d)}</strong> составляют <strong>одно целое</strong>.</p><ol class="algorithm reverse-step-list">${steps.map((t,i)=>`<li class="${step===i+1?'active':step>i+1?'done':''}"><span class="step-num">${i+1}</span><span>${t}</span></li>`).join('')}</ol><div class="control-block"><span class="label">Попробуй другой пример</span>${fractionChoices([[11,4],[7,3],[17,5],[14,8],[12,4]],a,'reverse-preset')}</div><details class="custom-example"><summary>Ввести свою дробь</summary><form id="reverseForm" novalidate><div class="inline-form"><label class="field-label">Числитель<input class="number-field" id="reverseN" type="number" inputmode="numeric" min="2" max="32" value="${n}" required></label><label class="field-label">Знаменатель<input class="number-field" id="reverseD" type="number" inputmode="numeric" min="2" max="8" value="${d}" required></label><button class="button secondary" type="submit">Показать</button></div><p class="error" id="reverseError" role="status">${esc(a.error)}</p></form><p class="tiny muted" style="margin-top:6px">Знаменатель: 2–8. Можно показать до четырёх целых.</p></details></div><div class="panel reverse-panel"><div class="model-top"><strong>${step===0?`Одна доля — ${frac(1,d)} целого`:`В каждой полной рамке ${d} ${doleWord(d)} = 1 целое`}</strong></div>${pieceModel(n,d,{layout:step===0?'loose':'grouped',from:step===1?'loose':null,colorMode:step===0?'single':'parts',labels:true,caption:step===0?`${n} ${doleWord(n)} одинакового размера. Соберём целые.`:'Размер долей не изменился.'})}${step>=1?`<div class="reverse-parts-key"><div class="reverse-key"><strong>${q}</strong><span>${q===1?'целое':'целых'}<br>из полных групп</span></div><div class="reverse-key orange-key"><strong>${r}</strong><span>${r===0?'долей в остатке':'оставшихся долей'}<br>${r===0?'всё собрано':'из '+d+' для целого'}</span></div></div>`:''}<div class="animation-stage ${step===3?'result':''}" role="status">${statuses[step]}</div>${seqControls('reverse',step)}${step===3&&r>0?`<div class="why-denominator">Осталось ${r} ${doleWord(r)} по ${frac(1,d)}. Это ${frac(r,d)} целого. <strong>Поэтому знаменатель — ${d}.</strong>${gcd(r,d)>1?` Затем сокращаем: ${frac(r,d)} = ${frac(r/gcd(r,d),d/gcd(r,d))}.`:''}</div>`:''}</div></div>`,`<strong>В смешанное число:</strong> делим числитель на знаменатель. Частное — целая часть, остаток — числитель. Знаменатель не меняем.<br><span class="note-inline">${n} : ${d} = ${q} (ост. ${r}); ${frac(n,d)} = ${final}. Проверка: ${q} × ${d} + ${r} = ${n}.</span>`);
}

function special(){const whole=S.special==='whole',s=S.specialStep;return page(`<div class="split"><div>${head('Два важных случая',whole?'Остаток ноль?<br>Получится целое.':'Дробную часть<br>можно сократить.')}<p class="lead">${whole?'Если числитель делится на знаменатель без остатка, дробь равна целому числу.':'После выделения целой части проверь, сокращается ли оставшаяся дробь.'}</p><div class="tabs"><button class="tab ${whole?'active':''}" data-action="special-mode" data-mode="whole" aria-pressed="${whole}">Без остатка</button><button class="tab ${!whole?'active':''}" data-action="special-mode" data-mode="reduce" aria-pressed="${!whole}">С сокращением</button></div><div class="remaining-proof">${whole?'12 : 4 = 3 (ост. 0).<br>Дробную часть с нулём не записываем.':`14 : 8 = 1 (ост. 6).<br>НОД(6, 8) = 2. Сократим ${frac(6,8)} на 2.`}</div><div class="buttons"><button class="button" data-action="special-step" data-focus="special-step">${s?'Повторить ↺':'Показать преобразование →'}</button></div></div><div class="panel"><div class="model-top"><strong>${whole?'Три полных целых':'Целая часть остаётся прежней'}</strong></div>${whole?pieceModel(12,4,{layout:s?'grouped':'loose',from:s?'loose':null,caption:s?'Остатка нет.':'12 долей по одной четвёртой.'}):pieceModel(s?7:14,s?4:8,{labels:false,caption:'Закрашенная величина не меняется.'})}<div class="math-row below-math">${whole?`${frac(12,4)}${s?'<span class="operator">=</span>3':''}`:`${frac(14,8)} <span class="operator">=</span> ${mixed(1,6,8)}${s?`<span class="operator">=</span>${mixed(1,3,4)}`:''}`}</div></div></div>`,whole?`Если остаток равен 0, получаем <strong>целое число</strong>: <span class="note-inline">${frac(12,4)} = 12 : 4 = 3.</span>`:`Дробную часть смешанного числа сокращаем, если это возможно:<br><span class="note-inline">${frac(14,8)} = ${mixed(1,6,8)} = ${mixed(1,3,4)}.</span>`);}
const QUESTIONS=[{text:'Правильная или неправильная?',note:()=>`Определи вид дроби: ${frac(5,5)}.`},{text:'Переведи в неправильную дробь.',note:()=>`Переведи в неправильную дробь: ${mixed(2,2,5)} = …`},{text:'Выдели целую часть.',note:()=>`Переведи в смешанное число: ${frac(17,6)} = …`},{text:'Чему равна дробь?',note:()=>`Вычисли: ${frac(18,3)} = …`}];
function practice(){const p=S.practice,i=p.index,done=p.done[i],a=p.answers[i]||{};let task='';if(i===0)task=`<div class="class-expression math-row">${frac(5,5,'big')}</div><div class="classification-options"><button class="chip" data-action="class-answer" data-answer="proper" ${done?'disabled':''}>Правильная</button><button class="chip" data-action="class-answer" data-answer="improper" ${done?'disabled':''}>Неправильная</button></div>`;else{const input=(id,aria,value,cls='')=>`<input class="answer-input ${cls}" id="${id}" type="number" inputmode="numeric" aria-label="${aria}" value="${value??''}" min="0" max="100" ${done?'disabled':''}>`;let answer=i===3?input('answerQ','Целое число',a.q,'answer-whole'):`${i===2?input('answerQ','Целая часть',a.q,'answer-whole'):''}<span class="answer-fraction">${input('answerN','Числитель',a.n)}<span class="answer-line"></span>${input('answerD','Знаменатель',a.d)}</span>`;task=`<form id="practiceForm" novalidate><div class="answer-set"><div class="math-row">${i===1?mixed(2,2,5):i===2?frac(17,6):frac(18,3)}<span class="operator">=</span></div>${answer}</div><div class="buttons"><button class="button" type="submit" ${done?'disabled':''}>Проверить</button></div></form>`;}
return page(`<div class="split"><div>${head('Пробуем сами','Объясни.<br>Переведи.<br>Проверь.')}<p class="lead">Выбирай любое задание.<br>Можно возвращаться к примерам.</p><div class="practice-tabs" aria-label="Задания">${QUESTIONS.map((_,j)=>`<button class="practice-tab ${i===j?'active':''} ${p.done[j]?'done':''}" data-action="practice-go" data-index="${j}" aria-label="Задание ${j+1}" aria-pressed="${i===j}">${j+1}</button>`).join('')}</div><div class="rule">${i===0?'Сравни числитель и знаменатель.':i===1?'Целая часть × знаменатель + числитель.':i===2?'Дели числитель на знаменатель с остатком.':'Если остаток равен нулю, получится целое число.'}</div><button class="text-button" style="margin-top:16px" data-action="practice-reset">Начать задания заново</button></div><div class="panel practice-panel"><div class="task-counter">Задание ${i+1} из 4</div><div class="question">${QUESTIONS[i].text}</div>${task}${p.messages[i]?`<div class="feedback ${p.kinds[i]}" role="status">${p.messages[i]}</div>`:''}</div></div>`,QUESTIONS[i].note());}
function summary(){return page(`<div class="recap-content">${head('Коротко о главном','Два направления. Одна величина.')}<div class="summary-top"><span>${frac(3,4)} &lt; 1 — правильная</span><span>${frac(7,4)} &gt; 1 — неправильная</span><span>${mixed(1,3,4)} — смешанное число</span></div><div class="summary-grid"><div class="summary-box"><h3>Смешанное → неправильная</h3><p>Целую часть умножаем на знаменатель, прибавляем числитель.</p><div class="math-row">${mixed(2,3,4)}<span class="operator">=</span>${frac('2 × 4 + 3',4)}<span class="operator">=</span>${frac(11,4)}</div></div><div class="summary-box"><h3>Неправильная → смешанное</h3><p>Делим с остатком.<br>11 : 4 = 2 (ост. 3).</p><div class="math-row">${frac(11,4)}<span class="operator">=</span>${mixed(2,3,4)}</div><p>Целая часть — 2, остаток — 3.</p></div></div></div>`,`При переводе <strong>знаменатель сначала сохраняется</strong>. Затем дробную часть можно сократить.<br><span class="note-inline">Проверка: ${mixed(2,3,4)} = ${frac(11,4)}, потому что 2 × 4 + 3 = 11.</span>`);}
const VIDEOS=[{id:'cWeeG6klKrQ',title:'Правильные и неправильные дроби'},{id:'yBuvqC5uhIM',title:'Смешанные числа и перевод дробей'}];
function videos(){const current=VIDEOS[S.video];return `<div class="lesson-body"><div class="video-layout"><div class="video-sidebar"><div class="eyebrow">Перед началом темы</div><h1 id="slideTitle" tabindex="-1">Сначала<br>посмотрим урок.</h1><p class="lead">Два видео, затем — примеры и анимации.</p><div class="video-options">${VIDEOS.map((v,i)=>`<button class="video-option ${S.video===i?'active':''}" data-action="video-pick" data-index="${i}" data-focus="video-${i}" aria-pressed="${S.video===i}"><span class="video-num">${i+1}</span><span>${v.title}</span></button>`).join('')}</div><p class="small muted">Выбери видео и нажми кнопку воспроизведения в плеере.</p><p class="offline-tip">Для просмотра видео нужен интернет.</p></div><div class="video-panel"><h2>${current.title}</h2><div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/${current.id}?rel=0" title="${current.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="video-actions"><a class="video-link" href="https://www.youtube.com/watch?v=${current.id}" target="_blank" rel="noopener noreferrer">Открыть на YouTube ↗</a>${S.video===0?'<button class="button" data-action="video-pick" data-index="1">Ко второму видео →</button>':'<button class="button" data-action="go" data-index="1">Начать тему →</button>'}</div></div></div></div><div class="video-bottom"><span>После видео разберём тему <strong>шаг за шагом</strong>.</span><span class="muted">К видео можно вернуться через «Содержание».</span></div>`;}

const SLIDES=[videos,intro,unit,proper,improper,mixedSlide,forward,reverse,special,practice,summary];
let animationTimer=null,unitTimer=null;
function stopAnimation(){clearTimeout(animationTimer);animationTimer=null;S.playing=null;}
function render(animate=false){const focus=document.activeElement?.getAttribute?.('data-focus');$('#scene').innerHTML=SLIDES[S.slide]();$('#scene').setAttribute('data-slide',S.slide);$('#scene').classList.toggle('enter',animate);$('#progressFill').style.width=((S.slide+1)/TITLES.length*100)+'%';$('#progress').setAttribute('aria-valuenow',S.slide+1);$('#stepLabel').textContent=`${String(S.slide+1).padStart(2,'0')} / ${TITLES.length} · ${TITLES[S.slide]}`;$('#backButton').disabled=S.slide===0;$('#nextButton').textContent=S.slide===0?'Начать тему →':S.slide===TITLES.length-1?'В начало ↺':'Далее →';$('#dots').innerHTML=TITLES.map((t,i)=>`<button class="dot ${i===S.slide?'active':i<S.slide?'completed':''}" data-action="go" data-index="${i}" aria-label="${i+1}. ${t}" title="${t}" ${i===S.slide?'aria-current="step"':''}></button>`).join('');if(focus&&!animate)$(`[data-focus="${focus}"]`)?.focus({preventScroll:true});if(animate)$('#announcer').textContent=`Шаг ${S.slide+1}: ${TITLES[S.slide]}`;}
function go(i){stopAnimation();clearTimeout(unitTimer);S.slide=Math.max(0,Math.min(TITLES.length-1,i));$('#scene').classList.remove('enter');void $('#scene').offsetWidth;render(true);window.scrollTo({top:0,behavior:'instant'});}
function play(kind){if(S.playing===kind){stopAnimation();render();return;}stopAnimation();S.playing=kind;S[kind].step=0;render();const tick=()=>{if(S.playing!==kind)return;S[kind].step++;if(S[kind].step>=3){S[kind].step=3;S.playing=null;render();return;}render();animationTimer=setTimeout(tick,1900);};animationTimer=setTimeout(tick,1000);}
function setMenu(open){$('#contents').classList.toggle('open',open);if(open){stopAnimation();$('#menuGrid').innerHTML=TITLES.map((t,i)=>`<button class="menu-item ${S.slide===i?'current':''}" data-action="menu-go" data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');$('#closeMenu').focus();}else{$('#contentsButton').focus();render();}}
function feedback(index,text,kind){S.practice.messages[index]=text;S.practice.kinds[index]=kind;render();}
function action(el){const a=el.dataset.action,n=Number(el.dataset.n),d=Number(el.dataset.d),ch=Number(el.dataset.change),kind=el.dataset.kind;switch(a){case'video-pick':S.video=Math.max(0,Math.min(1,Number(el.dataset.index)));break;case'go':go(Number(el.dataset.index));return;case'menu-go':setMenu(false);go(Number(el.dataset.index));return;case'unit-d':clearTimeout(unitTimer);S.unit={d,filled:false};break;case'unit-fill':clearTimeout(unitTimer);S.unit.filled=false;render();unitTimer=setTimeout(()=>{if(S.slide===2){S.unit.filled=true;render();}},40);return;case'proper-d':S.proper={d,n:Math.min(S.proper.n,d-1)};break;case'proper-n':S.proper.n=Math.max(1,Math.min(S.proper.d-1,S.proper.n+ch));break;case'improper-n':S.improper.n=Math.max(S.improper.d,Math.min(4*S.improper.d,S.improper.n+ch));break;case'improper-preset':S.improper={n,d};break;case'seq-go':stopAnimation();S[kind].step=Math.max(0,Math.min(3,Number(el.dataset.step)));break;case'seq-next':stopAnimation();S[kind].step=(S[kind].step+1)%4;break;case'play':play(kind);return;case'reverse-preset':stopAnimation();S.reverse={n,d,step:0,error:''};break;case'special-mode':S.special=el.dataset.mode;S.specialStep=0;break;case'special-step':S.specialStep=S.specialStep?0:1;break;case'practice-go':S.practice.index=Number(el.dataset.index);break;case'practice-reset':S.practice={index:0,done:[false,false,false,false],messages:['','','',''],kinds:['','','',''],answers:[null,null,null,null]};break;case'class-answer':if(S.practice.done[0])return;if(el.dataset.answer==='improper'){S.practice.done[0]=true;feedback(0,'Верно: 5 = 5. Дробь неправильная и равна 1.','good');}else feedback(0,'Сравни 5 и 5: они равны. Правильной дробь была бы при числителе меньше знаменателя.','try');return;default:return;}render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el);});
document.addEventListener('change',e=>{const control=e.target.dataset?.control;if(!control)return;const [key,field]=control.split('-'),v=Number(e.target.value);if(!['mixed','forward'].includes(key))return;stopAnimation();S[key][field]=v;if(field==='d')S[key].r=Math.min(S[key].r,v-1);if(key==='forward')S.forward.step=0;render();});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='reverseForm'){const n=Number($('#reverseN').value),d=Number($('#reverseD').value);if(!Number.isInteger(n)||!Number.isInteger(d)||d<2||d>8||n<d||n>4*d){S.reverse.error='Введи целые числа: 2 ≤ знаменатель ≤ 8; знаменатель ≤ числитель ≤ 4 × знаменатель.';$('#reverseError').textContent=S.reverse.error;return;}stopAnimation();S.reverse={n,d,step:0,error:''};render();}else if(e.target.id==='practiceForm'){const p=S.practice,i=p.index;if(p.done[i])return;const read=id=>{const el=$(id);return el&&el.value.trim()!==''?Number(el.value):null;};const q=read('#answerQ'),n=read('#answerN'),d=read('#answerD');p.answers[i]={q,n,d};if(i===1){if(n===12&&d===5){p.done[i]=true;feedback(i,'Верно! 2 × 5 + 2 = 12. Знаменатель остаётся 5.','good');}else feedback(i,'Сначала 2 × 5 = 10, затем 10 + 2 = 12. Какой знаменатель был в условии?','try');}else if(i===2){if(q===2&&n===5&&d===6){p.done[i]=true;feedback(i,'Верно! 17 : 6 = 2 (ост. 5). Получили 2 целых и 5 шестых.','good');}else if(Number.isInteger(q)&&Number.isInteger(n)&&Number.isInteger(d)&&q>=0&&n>=0&&d>0&&(q*d+n)*6===17*d)feedback(i,'Величина верная. Запиши дробную часть правильной дробью и сократи её, если возможно.','try');else feedback(i,'В 17 помещается две полные группы по 6. Остаток: 17 − 12 = 5.','try');}else if(i===3){if(q===6){p.done[i]=true;feedback(i,'Верно! 18 : 3 = 6, остаток равен нулю.','good');}else feedback(i,'Раздели 18 на 3. Здесь все доли собираются в целые.','try');}}});
$('#backButton').addEventListener('click',()=>go(S.slide-1));$('#nextButton').addEventListener('click',()=>go(S.slide===TITLES.length-1?0:S.slide+1));$('#contentsButton').addEventListener('click',()=>setMenu(true));$('#closeMenu').addEventListener('click',()=>setMenu(false));$('#contents').addEventListener('click',e=>{if(e.target.id==='contents')setMenu(false);});
let toastTimer;function toast(message){$('.toast')?.remove();clearTimeout(toastTimer);const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;document.body.append(t);toastTimer=setTimeout(()=>t.remove(),4500);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Полный экран на компьютере: нажмите F11.');}catch(e){toast('Полный экран на компьютере: нажмите F11.');}}
$('#fullscreenButton').addEventListener('click',fullscreen);document.addEventListener('fullscreenchange',()=>$('#fullscreenButton').setAttribute('aria-label',document.fullscreenElement?'Выйти из полного экрана':'На весь экран'));
document.addEventListener('keydown',e=>{if($('#contents').classList.contains('open')){if(e.key==='Escape'){e.preventDefault();setMenu(false);}if(e.key==='Tab'){const els=$$('#contents button'),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,select,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowRight'){e.preventDefault();if(S.slide<TITLES.length-1)go(S.slide+1);}else if(e.key==='ArrowLeft'){e.preventDefault();if(S.slide>0)go(S.slide-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(TITLES.length-1);}else if(['f','F','а','А'].includes(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();fullscreen();}});
render(true);
</script></body></html>
