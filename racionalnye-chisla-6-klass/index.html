function sameModel(a,b,step){

function distanceModel(a,b){

function movement(a,delta,step){

function bracketSlide(outer){

function questionFeedback(q,chosen){

function quizSlide(){

function rationalData(r){const an=r.kind==='fraction'?r.a*(r.d/r.ad):r.a,bn=r.kind==='fraction'?r.b*(r.d/r.bd):r.b,add=r.op==='−'?-bn:bn;return {an,bn,add,total:an+add};}

  for(let u=0;u<=units;u++)out+=`<line x1="${50+u*uw}" y1="${y}" x2="${50+u*uw}" y2="${y+41}" stroke="#91aa9b" stroke-width="2.5"/>`;

 const left=head('Собираем всё вместе','Сначала скобки.<br>Потом действия.')+`<p class="lead">Не пытаемся сделать всё сразу. Идём по коротким понятным шагам.</p>`+algorithm(['Раскрой скобки: проверь знак каждого слагаемого.','Сложение и вычитание без скобок выполняй слева направо.','На каждом шаге выбери правило: одинаковые или разные знаки.'],Math.max(0,step-1))+`<div class="control"><span class="label">Разбери по шагам</span>${choices(COMBO,example,'combo',q=>`<span class="math">${bracketExpr(q)}</span>`)}</div>`;
 const right=`<div class="panel-header"><span>Каждая строка равна предыдущей</span></div><div class="chain">${expressions.map((x,i)=>i<=step?`<div class="chain-line ${i===step?'current':''}"><span class="chain-num">${i+1}</span><div class="math">${i?'<span class="eq">=</span> ':''}${x}</div></div>`:`<div class="chain-line ghost"><span class="chain-num">${i+1}</span>${['','Раскрываем скобки','Считаем первые два числа','Находим ответ'][i]}</div>`).join('')}</div>${sequence('combo',3)}`;
 return page(split(left,right),`<strong>Порядок:</strong> раскрой скобки → вычисляй слева направо → применяй правила знаков.<br><span class="math">${expressions.join(' = ')}.</span>`);
}
function summaryContent(){return `<div class="summary-grid"><div class="summary-card mint"><h3>01 · Раскрываем скобки</h3><div class="summary-block"><strong>Перед скобками «+»</strong><br>Все знаки внутри сохраняем.<span class="math">+(+5) = +5<br>+(−8) = −8<br>+(3 − 6) = 3 − 6</span></div><div class="summary-block"><strong>Перед скобками «−»</strong><br>Каждый знак внутри меняем.<span class="math">−(+5) = −5<br>−(−8) = +8<br>−(3 − 6) = −3 + 6<br>−(−4 + 7) = 4 − 7</span></div><div class="summary-block">Числа перед скобками сохраняем.<span class="math">9 − (−2 + 5) = 9 + 2 − 5</span></div></div><div class="summary-card lilac"><h3>02 · Выбираем правило</h3><div class="summary-block"><strong>Сложение: одинаковые знаки</strong><br>Складываем модули.<br>Сохраняем общий знак.<span class="math">−2 + (−3) = −5</span><small>Сумма двух отрицательных чисел отрицательна.</small></div><div class="summary-block"><strong>Сложение: разные знаки</strong><br>Из большего модуля вычитаем меньший. Ставим знак числа с большим модулем.<span class="math">−2 + 3 = 1<br>5 + (−8) = −3</span></div><div class="summary-block"><strong>Вычитание</strong><br>Заменяем сложением с противоположным числом.<span class="math">a − b = a + (−b)</span></div><div class="summary-block"><strong>Равные модули, разные знаки</strong><br>Сумма равна нулю.<span class="math">−4 + 4 = 0</span></div></div><div class="summary-card"><h3>03 · Основные случаи</h3>${[['7 + 4 = 11','оба положительные'],['−2 + (−3) = −5','оба отрицательные'],['−2 + 3 = 1','модуль числа 3 больше'],['5 + (−8) = −3','модуль числа −8 больше'],['−2 − 3 = −5','−2 + (−3)'],['5 − (−4) = 9','5 + 4'],['7 − 10 = −3','7 + (−10)'],['−5 − (−2) = −3','−5 + 2']].map(([m,t])=>`<div class="summary-case"><span class="math">${m}</span><small>${t}</small></div>`).join('')}<div class="summary-block"><strong>Модуль — расстояние до нуля.</strong><span class="math">|−5| = 5 · |3| = 3 · |0| = 0</span></div></div></div><div class="summary-footer"><strong>Скобки → замена вычитания → сравнение или сложение модулей → знак ответа.</strong></div>`;}
function summarySlide(){return page(`<div class="summary-heading"><div>${head('Держи перед глазами','Сложение и вычитание.<br>Короткая памятка.')}</div><div class="summary-actions"><button class="quiet" data-action="print">Печать памятки</button><button class="quiet" data-action="go" data-index="2">К 20 примерам →</button></div></div>${summaryContent()}`,'');}
const SLIDES=[()=>bracketSlide(1),()=>bracketSlide(-1),quizSlide,roleSlide,moduleSlide,diffSlide,sameSlide,()=>subtractionSlide('sub'),()=>subtractionSlide('subdiff'),()=>subtractionSlide('subsame'),rationalSlide,comboSlide,summarySlide];
function stopPlay(){if(timer!==null)clearTimeout(timer);timer=null;S.playing=null;}
function render(transition=false){
 const focusKey=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.focus:null;
 $('scene').innerHTML=SLIDES[S.slide]();$('scene').dataset.slide=String(S.slide);$('scene').className='scene'+(transition?' enter':'');
 $('progressFill').style.width=((S.slide+1)/TITLES.length*100)+'%';$('position').textContent=`${String(S.slide+1).padStart(2,'0')} / ${TITLES.length} · ${TITLES[S.slide]}`;
 $('prev').disabled=S.slide===0;$('next').textContent=S.slide===TITLES.length-1?'К началу ↺':'Далее →';
 $('navDots').innerHTML=TITLES.map((t,i)=>`<button class="nav-dot ${i===S.slide?'active':''}" data-action="go" data-index="${i}" aria-label="${i+1}. ${t}" ${i===S.slide?'aria-current="step"':''}></button>`).join('');
 if(focusKey&&!transition){const node=document.querySelector(`[data-focus="${focusKey}"]`);if(node)node.focus({preventScroll:true});}
}
function go(i){stopPlay();S.slide=Math.max(0,Math.min(TITLES.length-1,i));render(true);window.scrollTo({top:0,behavior:'auto'});const h=$('slideTitle');if(h)h.focus({preventScroll:true});}
function play(kind,max){if(S.playing===kind){stopPlay();render();return}stopPlay();if(S[kind].step===max)S[kind].step=0;S.playing=kind;render();const tick=()=>{if(S.playing!==kind)return;S[kind].step++;if(S[kind].step>=max){S.playing=null;timer=null;render();return}render();timer=setTimeout(tick,2300);};timer=setTimeout(tick,1200);}
function toast(msg){$('toast').textContent=msg;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3500);}
function showContents(){stopPlay();render();$('contentsList').innerHTML=TITLES.map((t,i)=>`<button class="contents-item ${S.slide===i?'current':''}" data-action="go" data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');$('contentsDialog').showModal();}
function closeContents(){if($('contentsDialog').open)$('contentsDialog').close();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('В браузере можно включить полный экран клавишей F11.');}catch{toast('В этом окне полный экран недоступен. Открой HTML в отдельной вкладке.');}}
function handleAction(el){const {action,kind}=el.dataset;const index=Number(el.dataset.index);
 switch(action){
  case 'prev':go(S.slide-1);break;
  case 'next':go(S.slide===TITLES.length-1?0:S.slide+1);break;
  case 'go':closeContents();go(index);break;
  case 'summary':go(TITLES.length-1);break;
  case 'contents':showContents();break;
  case 'close-contents':closeContents();break;
  case 'fullscreen':fullscreen();break;
  case 'example':stopPlay();S[kind].example=index;if('step' in S[kind])S[kind].step=0;if(kind==='role')S.role.part=0;render();break;
  case 'stage':stopPlay();S[kind].step=Number(el.dataset.step);render();break;
  case 'step':stopPlay();S[kind].step=(S[kind].step+1)%(Number(el.dataset.max)+1);render();break;
  case 'play':play(kind,Number(el.dataset.max));break;
  case 'diff-preset':stopPlay();S.diff={a:Number(el.dataset.a),b:Number(el.dataset.b),step:0};render();break;
  case 'role-part':S.role.part=Number(el.dataset.part);render();break;
  case 'question':S.quiz.index=Math.max(0,Math.min(19,index));render();break;
  case 'answer':{const q=QUESTIONS[S.quiz.index],a=S.quiz.answers[S.quiz.index];if(a.solved)break;a.choice=index;a.attempts++;if(a.first===null)a.first=index===q.ci;if(index===q.ci)a.solved=true;render();break;}
  case 'hint':S.quiz.answers[S.quiz.index].hint=true;render();break;
  case 'quiz-reset':S.quiz={index:0,answers:QUESTIONS.map(()=>({choice:null,solved:false,first:null,attempts:0,hint:false}))};render();break;
  case 'print':stopPlay();$('printSheet').innerHTML='<h1>Сложение и вычитание рациональных чисел</h1>'+summaryContent();window.print();break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)handleAction(el);});
document.addEventListener('input',e=>{if(e.target.dataset.action==='module-range'){
 S.module[e.target.dataset.key]=Number(e.target.value);const {a,b}=S.module,aa=Math.abs(a),bb=Math.abs(b);
 e.target.nextElementSibling.textContent=fmt(Number(e.target.value));
 $('moduleCards').innerHTML=`<div class="module-card math">|${fmt(a)}| = ${aa}</div><div class="module-card math">|${fmt(b)}| = ${bb}</div>`;
 $('moduleDrawing').innerHTML=distanceModel(a,b)+`<div class="math equation medium">|${fmt(a)}| ${aa===bb?'=':aa>bb?'&gt;':'&lt;'} |${fmt(b)}|</div><p class="stage-caption">${aa===bb?'Модули равны.':`Число ${fmt(aa>bb?a:b)} дальше от нуля: его модуль больше.`}</p>`;
}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;if($('contentsDialog').open)return;if(e.key==='ArrowRight'){e.preventDefault();go(S.slide+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(S.slide-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(TITLES.length-1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}});
$('contentsDialog').addEventListener('click',e=>{if(e.target===$('contentsDialog')){const r=$('contentsDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeContents();}});
render();

</script>
</body>
</html>
