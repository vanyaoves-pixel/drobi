@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media print{.topbar,.footer,.progress-track,.menu-overlay,.toast{display:none!important}.main{padding:0;display:block}.app{min-height:0}body{background:white}.panel{box-shadow:none}.scene{break-inside:avoid}}

/* Компактные модели сохраняют один масштаб целого на каждом шаге. */
.bar-model{display:grid;grid-template-columns:minmax(0,1fr) 48px;align-items:center;gap:13px}.bar-value{text-align:center}.bar-value .frac{font-size:24px}.bar-caption{font-size:15px;margin-bottom:5px}.bar-block{margin-bottom:10px}.visual-title{margin-bottom:12px}.flow-arrow{height:22px;margin:5px 0 10px}.equation-box{margin-top:13px;padding-top:13px}.equation-box .formula{font-size:29px;gap:12px}.equation-box .formula .frac{font-size:34px}.same-badge{margin-top:14px;padding:9px 12px;font-size:15px}.parts-panel .pie.interactive{max-height:240px}.parts-panel .control-block{margin-top:10px}.parts-panel .hint{margin-top:13px;font-size:14px}.parts-panel .small-controls{margin-top:3px}.parts-panel .equal-note{margin-top:9px;font-size:16px}.parts-panel .label{letter-spacing:.06em}.reduce-result .formula{font-size:28px;gap:12px}.reduce-result .formula .frac{font-size:34px}
@media(max-width:760px){.bar-model{grid-template-columns:minmax(0,1fr) 38px;gap:9px}.bar-value .frac{font-size:21px}.equation-box .formula{gap:10px}.equation-box .formula .frac{font-size:31px}.parts-panel .pie.interactive{max-height:260px}.parts-panel .visual-title{align-items:flex-start}.parts-panel .visual-title .label{max-width:120px;text-align:right;font-size:10px}.parts-panel .equal-note{font-size:15px}}
</style>
</head>
<body>
<div class="app">
 <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"></span>ДРОБИ<span class="brand-sub">Шаг за шагом</span></div><div class="top-actions"><button class="quiet" id="contentsButton" aria-haspopup="dialog" aria-controls="contents">Содержание</button><button class="quiet" id="fullscreenButton" title="На весь экран" aria-label="На весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span class="fullscreen-label">На весь экран</span></button></div></header>
 <div class="progress-track" role="progressbar" aria-label="Пройдено шагов" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" id="progress"><div class="progress-fill" id="progressFill"></div></div>
 <main class="main"><section class="scene" id="scene" aria-labelledby="slideTitle"></section></main>
 <footer class="footer"><button class="button secondary nav-back" id="backButton" aria-label="Предыдущий шаг">← Назад</button><div class="nav-center"><div class="step-label" id="stepLabel"></div><div class="dots" id="dots" aria-label="Переход к шагу"></div><div class="keyboard-hint">← → на клавиатуре · F — весь экран</div></div><button class="button nav-next" id="nextButton">Продолжить →</button></footer>
</div>
<div class="menu-overlay" id="contents"><div class="menu-dialog" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><div class="menu-head"><h2 id="menuTitle">Шаги урока</h2><button class="menu-close" id="closeMenu" aria-label="Закрыть содержание">×</button></div><div class="menu-grid" id="menuGrid"></div></div></div>
<div class="sr-only" id="announcer" aria-live="polite"></div>
<noscript><p style="padding:30px">Для работы интерактивного урока включите JavaScript в браузере.</p></noscript>
<script>
'use strict';
const TITLES=['Знакомимся с дробями','Часть целого','Дробь и деление','Читаем дроби','Умножаем обе части','Делим обе части','Сокращаем на НОД','Сокращаем по шагам','Проверь себя','Главное о дробях'];
const C={teal:'#138573',purple:'#6b55b5',orange:'#e87949',blue:'#467eaa',empty:'#e8eee5',ink:'#233c41'};
const S={slide:0,parts:{d:8,selected:[0,1,2]},sharing:{n:3,d:4,shown:false},reading:{n:3,d:4},multiply:{n:2,d:3,k:2},divide:{n:8,d:12,k:2},reduce:{n:12,d:18,revealed:false,error:''},steps:{n:24,d:36,history:[{n:24,d:36}]},practice:{index:0,done:[false,false,false],message:'',kind:''}};
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function frac(n,d,cls=''){return `<span class="frac ${cls}" role="math" aria-label="${escapeHTML(n)} делить на ${escapeHTML(d)}"><span class="num">${n}</span><span class="den">${d}</span></span>`;}
function operatedFrac(n,d,k,op){return `<span class="frac" role="math" aria-label="${n} ${op==='×'?'умножить на':'разделить на'} ${k}, делённое на ${d} ${op==='×'?'умножить на':'разделить на'} ${k}"><span class="num">${n}<span class="factor-text"> ${op} ${k}</span></span><span class="den">${d}<span class="factor-text"> ${op} ${k}</span></span></span>`;}
const arrow=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
const down=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v16m-6-6 6 6 6-6"/></svg>';
function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function divisors(n){const a=[];for(let i=1;i<=n;i++)if(n%i===0)a.push(i);return a;}
function commonDivisors(n,d){return divisors(gcd(n,d)).filter(x=>x>1);}
function pie(n,d,{interactive=false,selected=null,color=C.teal,colors=null,labels=false,extra=''}={}){
 let out=`<svg class="pie ${interactive?'interactive':''} ${extra}" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" ${interactive?'role="group"':'role="img"'} aria-label="${interactive?'Нажимайте на части. ':''}Выбрано ${n} из ${d} равных частей">`;
 for(let i=0;i<d;i++){
  const a=-Math.PI/2+2*Math.PI*i/d,b=-Math.PI/2+2*Math.PI*(i+1)/d;
  const x1=160+134*Math.cos(a),y1=160+134*Math.sin(a),x2=160+134*Math.cos(b),y2=160+134*Math.sin(b);
  const on=selected?selected.includes(i):i<n,fill=colors?colors[i%colors.length]:(on?color:C.empty);
  const attrs=interactive?`data-action="part" data-i="${i}" data-focus="part-${i}" role="button" tabindex="0" aria-label="Часть ${i+1} из ${d}" aria-pressed="${on}"`:'';
  const path=`M 160 160 L ${x1.toFixed(5)} ${y1.toFixed(5)} A 134 134 0 ${d===1?1:0} 1 ${x2.toFixed(5)} ${y2.toFixed(5)} Z`;
  if(d===1)out+=`<circle cx="160" cy="160" r="134" fill="${fill}" stroke="#fffefb" stroke-width="2" class="piece ${interactive?'clickable':''}" ${attrs}/>`;
  else out+=`<path d="${path}" fill="${fill}" stroke="#fffefb" stroke-width="2" stroke-linejoin="round" class="piece ${interactive?'clickable':''}" ${attrs}/>`;
  if(labels){const mid=(a+b)/2;out+=`<text x="${(160+99*Math.cos(mid)).toFixed(3)}" y="${(160+99*Math.sin(mid)+6).toFixed(3)}" text-anchor="middle" font-size="17" class="piece-num" fill="${on?'#ffffff':'#627274'}">${i+1}</text>`;}
 }
 out+='<circle cx="160" cy="160" r="135" fill="none" stroke="#c5d5c7" stroke-width="2" pointer-events="none"/></svg>';return out;
}
function bar(n,d,{color=C.teal,group=1,height=58}={}){
 const w=480,fill=w*n/d;
 let out=`<svg class="bar-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 482 ${height+2}" role="img" aria-label="Полоса: закрашено ${n} из ${d} равных частей${group>1?', объединение по '+group:''}"><rect x="0" y="0" width="480" height="${height}" fill="${C.empty}"/><rect x="0" y="0" width="${fill}" height="${height}" fill="${color}"/>`;
 for(let i=1;i<d;i++){const x=w*i/d;out+=`<line class="partition-line" x1="${x}" x2="${x}" y1="0" y2="${height}" stroke="${i%group===0&&group>1?'#233c41':'#fffefb'}" stroke-width="${i%group===0&&group>1?2.2:1.3}" ${group>1&&i%group!==0?'opacity=".5"':''} style="animation-delay:${Math.min(i*.009,.25)}s"/>`;}
 out+=`<rect x="0" y="0" width="480" height="${height}" fill="none" stroke="#8dac9e" stroke-width="1.5"/></svg>`;return out;
}
function barBlock(n,d,label,opts={}){return `<div class="bar-block"><div class="bar-caption"><span>${label}</span></div><div class="bar-model">${bar(n,d,opts)}<span class="bar-value">${frac(n,d)}</span></div></div>`;}
function choiceFractions(items,current,action){return `<div class="chip-row">${items.map(([n,d])=>`<button class="chip ${current.n===n&&current.d===d?'active':''}" data-action="${action}" data-n="${n}" data-d="${d}" data-focus="${action}-${n}-${d}" aria-pressed="${current.n===n&&current.d===d}" aria-label="${n} делить на ${d}">${frac(n,d)}</button>`).join('')}</div>`;}
function head(k,title){return `<div class="eyebrow">${String(S.slide+1).padStart(2,'0')} / ${k}</div><h2 id="slideTitle" tabindex="-1">${title}</h2>`;}
function hint(text){return `<div class="hint"><span class="hint-dot" aria-hidden="true"></span><span>${text}</span></div>`;}
function intro(){return `<div class="split"><div><div class="eyebrow">Увидеть · понять · попробовать</div><h1 id="slideTitle" tabindex="-1">Дроби.<br><em>По частям.</em></h1><p class="lead">От части целого<br>до сокращения дробей.</p><div class="hero-points"><span>Нажимай на части</span><span>Меняй числа</span><span>Замечай закономерности</span></div></div><div class="hero-art"><div class="hero-disk"></div><div class="hero-main">${pie(1,2)}<div class="hero-bottom">${frac(1,2)}<span>=</span>${frac(2,4)}<span>=</span>${frac(4,8)}</div></div><div class="hero-fraction">${frac(1,2,'big')}</div><div class="hero-stamp">Частей больше. Доля та же.</div></div></div>`;}
function parts(){const p=S.parts,n=p.selected.length;return `<div class="split"><div>${head('Смысл дроби','Целое делим<br>на равные части')}<p class="lead">Дробь показывает, сколько равных частей целого взяли.</p><div class="terms"><div class="term"><span class="term-number teal">${n}</span><p><strong class="teal">Числитель</strong><br>Сколько частей взяли.</p></div><div class="term"><span class="term-number purple">${p.d}</span><p><strong class="purple">Знаменатель</strong><br>На сколько равных частей разделили целое.</p></div></div><div class="rule">${frac(n,p.d)} = ${n} : ${p.d}<span class="muted"> &nbsp;Дробь — это ещё и частное.</span></div><p class="note">Знаменатель не может быть равен нулю.</p></div><div class="panel parts-panel"><div class="visual-title"><strong>Собери свою дробь</strong><span class="label">1 круг = 1 целое</span></div><div class="part-layout">${pie(n,p.d,{interactive:true,selected:p.selected,labels:true})}<div class="part-count"><span class="frac big" role="math" aria-label="${n} делить на ${p.d}"><span class="num teal">${n}</span><span class="den purple">${p.d}</span></span><div class="part-caption">взяли ${n}<br>из ${p.d} частей</div></div></div><div class="control-block"><span class="label">Разделить целое на</span><div class="chip-row">${[2,3,4,5,6,8,10,12].map(d=>`<button class="chip ${p.d===d?'active':''}" data-action="parts-d" data-d="${d}" data-focus="parts-d-${d}" aria-pressed="${p.d===d}">${d}</button>`).join('')}</div></div>${hint('Нажимай на секторы: выбирай части или убирай их.')}<div class="small-controls"><button class="text-button" data-action="parts-clear" data-focus="parts-clear">Убрать все</button><button class="text-button" data-action="parts-all" data-focus="parts-all">Взять всё</button></div><div class="equal-note">${n===0?`${frac(0,p.d)} = 0 — ни одной части`:n===p.d?`${frac(p.d,p.d)} = 1 — целое`:'Все части обязательно равны.'}</div></div></div>`;}
function sharing(){const {n,d,shown}=S.sharing,colors=[C.teal,C.purple,C.orange,C.blue],peopleWords={2:'двумя',3:'тремя',4:'четырьмя'},wholeLabels=Array.from({length:n},(_,j)=>`<div class="share-source-label">${j+1}-е целое</div>`).join(''),sumFormula=Array.from({length:n},()=>frac(1,d)).join('<span class="share-plus">+</span>');return `<div class="split wide-visual"><div>${head('Дробь и деление','Дробная черта —<br>знак деления')}<p class="lead">${n===1?'Одно целое делим':`${n} целых делим`} поровну между ${peopleWords[d]}.</p><div class="formula large" style="justify-content:flex-start;margin:26px 0">${n} : ${d}<span class="math-sign">=</span>${frac(n,d)}</div><p class="lead">Числитель — <strong class="teal">делимое</strong>.<br>Знаменатель — <strong class="purple">делитель</strong>.</p><div class="rule lilac">Сначала каждое целое делим на ${d} равные части.<br>Потом каждому даём <strong>по одной части от каждого целого</strong>.</div><div class="control-block"><span class="label">Выбери пример</span>${choiceFractions([[1,2],[2,3],[3,4]],{n,d},'share-preset')}</div><div class="buttons"><button class="button" data-action="share" data-focus="share">${shown?'Показать ещё раз':'Разделить поровну'} ${arrow()}</button></div></div><div class="panel mint"><div class="visual-title"><strong>Было: ${n} ${n===1?'целое':'целых'}</strong><span class="label">Равные доли</span></div><div class="source-cakes ${shown?'divided':''}">${Array.from({length:n},()=>pie(d,d,{colors})).join('')}</div><div class="share-source-labels">${wholeLabels}</div><p class="small muted" style="text-align:center">Каждое целое разделено на ${d} равные части.</p>${shown?`<div class="people" style="--people:${d}">${Array.from({length:d},(_,i)=>`<div class="person" style="--delay:${i*.1}s;--person-color:${colors[i]}"><div class="person-label"><span class="person-dot"></span>${i+1}-му</div><div class="share-chunks">${Array.from({length:n},(_,j)=>`<div class="share-chunk"><div class="share-chunk-label">от ${j+1}-го</div>${pie(1,d,{color:colors[i],extra:'share-mini'})}</div>`).join('')}</div><div class="share-formula">${sumFormula}<span class="share-eq">=</span>${frac(n,d)}</div><div class="share-card-note">По одной ${d===2?'половине':d===3?'трети':d===4?'четверти':'доле'} от каждого целого.</div></div>`).join('')}</div><div class="result-note">Каждый получил ${n} ${n===1?'часть':'части'} по ${frac(1,d)}, то есть ${frac(n,d)} целого.</div>`:'<div class="empty-sharing">Нажми «Разделить поровну».</div>'}</div></div>`;}
const countWords={1:'одна',2:'две',3:'три',4:'четыре',5:'пять',6:'шесть',7:'семь',8:'восемь',9:'девять',10:'десять',11:'одиннадцать'};
const denomWords={2:['вторая','вторых'],3:['третья','третьих'],4:['четвёртая','четвёртых'],5:['пятая','пятых'],6:['шестая','шестых'],7:['седьмая','седьмых'],8:['восьмая','восьмых'],9:['девятая','девятых'],10:['десятая','десятых'],11:['одиннадцатая','одиннадцатых'],12:['двенадцатая','двенадцатых']};
function readFraction(n,d){return `${countWords[n]} ${denomWords[d][n===1?0:1]}`;}
function reading(){const {n,d}=S.reading;return `<div class="split"><div>${head('Как читать','Сначала — сколько.<br>Потом — каких.')}<p class="lead"><strong class="teal">Числитель</strong> называем обычным числом: одна, две, три…</p><p class="lead" style="margin-top:17px"><strong class="purple">Знаменатель</strong> называет доли: вторых, третьих, четвёртых…</p><div class="control-block"><span class="label">Прочитай дробь</span>${choiceFractions([[1,2],[1,3],[1,4],[2,3],[3,4],[5,8],[7,10]],{n,d},'read-preset')}</div><div class="rule lilac">${frac(1,2)} — одна вторая.<br><span class="muted">Можно сказать: «половина».</span></div></div><div class="panel"><div class="reading-layout"><span class="frac huge" role="math" aria-label="${n} делить на ${d}"><span class="num teal">${n}</span><span class="den purple">${d}</span></span><div class="read-words"><span>${countWords[n]}<small class="read-word-note">сколько частей?</small></span><span>${denomWords[d][n===1?0:1]}<small class="read-word-note">каких частей?</small></span></div></div><div class="reading-line">${readFraction(n,d)}</div><div class="reading-model">${bar(n,d)}</div><p class="note" style="text-align:center">Закрашено ${n} из ${d} равных частей.</p></div></div>`;}
function multiply(){const {n,d,k}=S.multiply;return `<div class="split wide-visual"><div>${head('Основное свойство · умножение','Части мельче.<br>Доля та же.')}<p class="lead">Умножим числитель и знаменатель <strong class="purple">на одно и то же число</strong>.</p><div class="control-block"><span class="label">Исходная дробь</span>${choiceFractions([[1,2],[2,3],[3,4],[3,5]],{n,d},'multiply-preset')}</div><div class="control-block"><span class="label">Умножить оба числа на</span><div class="chip-row">${[1,2,3,4,5,6].map(v=>`<button class="chip factor ${k===v?'active':''}" data-action="multiply-k" data-k="${v}" data-focus="multiply-k-${v}" aria-pressed="${k===v}">× ${v}</button>`).join('')}</div></div><div class="rule lilac">Мы <strong>не меняем целое</strong>, а только делим каждую часть ещё на ${k}.</div><p class="note">Величина дроби <strong>не меняется</strong>.<br>Умножать на ноль нельзя.</p></div><div class="panel"><div class="visual-title"><strong>Целое в обоих рисунках одинаковое</strong></div>${barBlock(n,d,'До умножения')}<div class="flow-arrow">${down()} ${k===1?'Количество частей не меняется':`Каждую часть делим ещё на ${k}`}</div>${barBlock(n*k,d*k,'После умножения')}<div class="equation-box"><div class="formula">${frac(n,d)}<span class="math-sign">=</span>${operatedFrac(n,d,k,'×')}<span class="math-sign">=</span>${frac(n*k,d*k)}</div></div><div class="same-badge">Закрашенная длина та же: изменилось только число частей.</div></div></div>`;}
function divide(){const {n,d,k}=S.divide;return `<div class="split wide-visual"><div>${head('Основное свойство · деление','Части крупнее.<br>Доля та же.')}<p class="lead">Разделим числитель и знаменатель <strong class="purple">на один и тот же общий делитель</strong>.</p><div class="control-block"><span class="label">Исходная дробь</span>${choiceFractions([[6,8],[8,12],[9,12],[12,18]],{n,d},'divide-preset')}</div><div class="control-block"><span class="label">Разделить оба числа на</span><div class="chip-row">${commonDivisors(n,d).map(v=>`<button class="chip factor ${k===v?'active':''}" data-action="divide-k" data-k="${v}" data-focus="divide-k-${v}" aria-pressed="${k===v}">: ${v}</button>`).join('')}</div></div><div class="rule lilac">Мы <strong>не отнимаем</strong> части, а <strong>объединяем</strong> по ${k} мелких частей в одну крупную.</div><p class="note">Оба числа должны делиться <strong>без остатка</strong>.<br>Делитель не равен нулю.</p></div><div class="panel"><div class="visual-title"><strong>Объединяем мелкие части по ${k}</strong></div>${barBlock(n,d,'До деления',{group:k})}<div class="flow-arrow">${down()} ${k} мелких частей → 1 крупная</div>${barBlock(n/k,d/k,'После деления')}<div class="equation-box"><div class="formula">${frac(n,d)}<span class="math-sign">=</span>${operatedFrac(n,d,k,':')}<span class="math-sign">=</span>${frac(n/k,d/k)}</div></div><div class="same-badge">Закрашенная длина осталась той же. Изменилась только запись дроби.</div></div></div>`;}
function reduce(){const {n,d,revealed,error}=S.reduce,g=gcd(n,d);const divList=(v)=>divisors(v).map(i=>`<span class="${n%i===0&&d%i===0?'shared':''}">${i}</span>`).join('');return `<div class="split wide-visual"><div>${head('Сокращение дроби','Делим на НОД.<br>Сокращаем сразу.')}<p class="lead"><strong>Сократить дробь</strong> — разделить её числитель и знаменатель на общий делитель, больший 1.</p><div class="rule">Деление на <strong>НОД</strong> сразу даёт <strong>несократимую дробь</strong>.</div><div class="control-block"><span class="label">Выбери или задай дробь</span>${choiceFractions([[12,18],[18,24],[15,20],[7,12]],{n,d},'reduce-preset')}<form id="reduceForm" novalidate><div class="input-pair"><label class="field-label" for="reduceN">Числитель<input class="number-field" id="reduceN" type="number" inputmode="numeric" value="${n}" min="1" max="60" required></label><label class="field-label" for="reduceD">Знаменатель<input class="number-field" id="reduceD" type="number" inputmode="numeric" value="${d}" min="1" max="60" required></label><button class="button secondary" style="align-self:end" type="submit">Показать</button></div><div class="error" role="status">${escapeHTML(error)}</div></form><p class="tiny muted">Для модели одного целого: 1 ≤ числитель ≤ знаменатель ≤ 60.</p></div></div><div class="panel">${barBlock(n,d,'Исходная дробь')}${revealed?'':`<div class="small muted">Делители ${n}:</div><div class="divisors">${divList(n)}</div><div class="small muted" style="margin-top:10px">Делители ${d}:</div><div class="divisors">${divList(d)}</div>`}<div class="gcd-box">НОД(${n}, ${d}) = ${g}</div>${g===1?'<div class="result-note">Общий делитель только 1.<br>Дробь уже несократимая.</div>':revealed?`<div class="reduce-result"><div class="formula">${frac(n,d)}<span class="math-sign">=</span>${operatedFrac(n,d,g,':')}<span class="math-sign">=</span>${frac(n/g,d/g)}</div><div style="margin-top:17px">${bar(n/g,d/g,{height:55})}</div><div class="result-note">${n/g===d/g?'Получили целое: '+frac(n/g,d/g)+' = 1.':`НОД(${n/g}, ${d/g}) = 1. Дальше не сократить.`}</div></div>`:`<button class="button purple-button full-width" style="margin-top:18px" data-action="reduce-reveal" data-focus="reduce-reveal">Разделить на НОД = ${g}</button>`}</div></div>`;}
function steps(){const st=S.steps,last=st.history[st.history.length-1],ds=commonDivisors(last.n,last.d),done=ds.length===0;return `<div class="split wide-visual"><div>${head('Сокращение дроби','Можно постепенно.<br>Результат тот же.')}<p class="lead">Выбирай <strong class="purple">любой общий делитель</strong>, больший 1. Повторяй, пока дробь не станет несократимой.</p><div class="control-block"><span class="label">Начни с дроби</span>${choiceFractions([[24,36],[18,30],[36,48]],st,'steps-preset')}</div><div class="control-block"><span class="label">${done?'Готово':'Сейчас можно разделить оба числа на'}</span><div class="chip-row">${done?'<span class="teal" style="font-size:21px;font-weight:750">Общих делителей больше 1 нет.</span>':ds.map(k=>`<button class="chip factor" data-action="step-divide" data-k="${k}" data-focus="step-divide-${k}">: ${k}</button>`).join('')}</div></div><div class="buttons"><button class="button secondary" data-action="step-undo" data-focus="step-undo" ${st.history.length===1?'disabled':''}>Отменить шаг</button><button class="text-button" data-action="step-reset" data-focus="step-reset">Начать заново</button></div><div class="rule ${done?'':'lilac'}">${done?`НОД(${last.n}, ${last.d}) = 1.<br><strong>Дробь несократимая.</strong>`:'Можно делить несколько раз.<br>Можно сразу разделить на НОД.'}</div></div><div class="panel">${barBlock(st.n,st.d,'В начале')}${barBlock(last.n,last.d,'Сейчас')}<div class="path">${st.history.map((a,i)=>`<div class="path-fraction">${i?`<span class="path-op">: ${a.by}${arrow()}</span>`:''}<span class="${done&&i===st.history.length-1?'final-fraction':''}">${frac(a.n,a.d)}</span></div>`).join('')}</div><div class="step-note">${st.history.length===1?'Выбери делитель слева — увидишь первый шаг.':`Последний шаг: ${st.history[st.history.length-2].n} : ${last.by} = ${last.n} и ${st.history[st.history.length-2].d} : ${last.by} = ${last.d}.`}</div><div class="same-badge">На каждом шаге закрашена одна и та же доля.</div></div></div>`;}
function practice(){const {index,done,message,kind}=S.practice;let task='';if(index===0)task=`<div class="question">Какая часть целого закрашена?</div><div style="max-width:255px;margin:auto">${pie(3,8)}</div><div class="chip-row" style="justify-content:center;margin-top:12px">${[[3,8],[5,8],[3,5]].map(([n,d])=>`<button class="chip" data-action="practice-choice" data-n="${n}" data-d="${d}" ${done[0]?'disabled':''}>${frac(n,d)}</button>`).join('')}</div>`;if(index===1)task=`<div class="question">Заполни пропуск.</div><div style="margin:28px 0">${bar(2,3)}<div style="margin-top:12px">${bar(8,12)}</div></div><form id="practiceForm" novalidate><div class="formula large">${frac(2,3)}<span class="math-sign">=</span><span class="frac"><span class="num"><input class="answer-input" id="answerN" inputmode="numeric" type="number" min="0" max="100" aria-label="Недостающий числитель" ${done[1]?'value="8" disabled':''}></span><span class="den">12</span></span></div><div class="buttons" style="justify-content:center"><button class="button" type="submit" ${done[1]?'disabled':''}>Проверить</button></div></form>`;if(index===2)task=`<div class="question">Сократи дробь до конца.</div><div style="margin:24px 0">${bar(18,24)}</div><form id="practiceForm" novalidate><div class="formula large">${frac(18,24)}<span class="math-sign">=</span><span class="answer-fraction"><input class="answer-input" id="answerN" inputmode="numeric" type="number" min="1" max="100" aria-label="Числитель сокращённой дроби" ${done[2]?'value="3" disabled':''}><span class="answer-line"></span><input class="answer-input" id="answerD" inputmode="numeric" type="number" min="1" max="100" aria-label="Знаменатель сокращённой дроби" ${done[2]?'value="4" disabled':''}></span></div><div class="buttons" style="justify-content:center"><button class="button" type="submit" ${done[2]?'disabled':''}>Проверить</button></div></form>`;return `<div class="split"><div>${head('Пробуем сами','Теперь твоя очередь.')}<p class="lead">Три коротких задания.<br>Смотри на рисунок и объясняй свой ответ.</p><div class="task-dots" aria-label="Выполнено ${done.filter(Boolean).length} из 3">${done.map((v,i)=>`<span class="${v?'done':i===index?'current':''}"></span>`).join('')}</div><div class="rule">${index===0?'Знаменатель — все равные части.<br>Числитель — выбранные.':index===1?'Чтобы получить равную дробь, меняем оба числа одинаково.':'Несократимая дробь: общий делитель числителя и знаменателя только 1.'}</div>${done[index]?`<div class="buttons"><button class="button" data-action="practice-next">${index<2?'Следующее задание':'К главному'} ${arrow()}</button></div>`:''}<button class="text-button" style="margin-top:21px" data-action="practice-reset">Пройти задания заново</button></div><div class="panel"><div class="task-counter">${index+1} / 3</div>${task}${message?`<div class="feedback ${kind}" role="status">${message}</div>`:''}</div></div>`;}
function recap(){return `${head('Всё складывается','Запись меняется. Дробь остаётся равной.')}<div class="recap-grid"><article class="recap-card"><div class="recap-number">1</div><h3>Часть и частное</h3><p>Равные части целого.<br>Дробная черта — деление.</p><div class="formula">${frac(3,4)} = 3 : 4</div><div style="margin-top:20px">${bar(3,4,{height:52})}</div></article><article class="recap-card"><div class="recap-number">2</div><h3>Основное свойство</h3><p>Умножаем или делим оба числа на одно и то же число, не равное нулю.</p><div class="formula">${frac(1,2)} = ${frac(2,4)} = ${frac(4,8)}</div><p class="tiny">При сокращении делим без остатка.</p></article><article class="recap-card"><div class="recap-number">3</div><h3>Сокращение</h3><p>Сразу на НОД или по шагам.<br>В конце НОД равен 1.</p><div class="formula">${frac(12,18)} = ${frac(6,9)} = ${frac(2,3)}</div><p class="tiny">Сначала разделили на 2, затем на 3.</p></article></div><div class="recap-end"><span>Одно целое. Равные части. <strong>Та же величина.</strong></span><button class="button" data-action="go" data-index="1">Ещё раз попробовать ${arrow()}</button></div>`;}
const SLIDES=[intro,parts,sharing,reading,multiply,divide,reduce,steps,practice,recap];
function render(animate=false){
 const active=document.activeElement,focus=active?.getAttribute?.('data-focus');
 $('#scene').innerHTML=SLIDES[S.slide]();$('#scene').classList.toggle('enter',animate);
 $('#progressFill').style.width=((S.slide+1)/TITLES.length*100)+'%';$('#progress').setAttribute('aria-valuenow',S.slide+1);
 $('#stepLabel').textContent=`${String(S.slide+1).padStart(2,'0')} / ${TITLES.length} · ${TITLES[S.slide]}`;
 $('#backButton').disabled=S.slide===0;$('#nextButton').textContent=S.slide===0?'Начать →':S.slide===TITLES.length-1?'В начало ↺':'Далее →';
 $('#dots').innerHTML=TITLES.map((t,i)=>`<button class="dot ${i===S.slide?'active':i<S.slide?'completed':''}" data-action="go" data-index="${i}" aria-label="Шаг ${i+1}. ${t}" ${i===S.slide?'aria-current="step"':''} title="${t}"></button>`).join('');
 if(focus&&!animate){const el=$(`[data-focus="${focus}"]`);el?.focus({preventScroll:true});}
 if(animate){$('#announcer').textContent=`Шаг ${S.slide+1}. ${TITLES[S.slide]}`;}
}
function go(i){S.slide=Math.max(0,Math.min(TITLES.length-1,i));$('#scene').classList.remove('enter');void $('#scene').offsetWidth;render(true);window.scrollTo({top:0,behavior:'instant'});}
function setMenu(open){$('#contents').classList.toggle('open',open);if(open){$('#menuGrid').innerHTML=TITLES.map((t,i)=>`<button class="menu-item ${i===S.slide?'current':''}" data-action="menu-go" data-index="${i}"><span>${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');$('#closeMenu').focus();}else $('#contentsButton').focus();}
function announce(text){$('#announcer').textContent=text;}
function feedback(message,kind){S.practice.message=message;S.practice.kind=kind;render();}
function action(el){const a=el.dataset.action,n=Number(el.dataset.n),d=Number(el.dataset.d),k=Number(el.dataset.k);switch(a){
 case 'go':go(Number(el.dataset.index));return;
 case 'menu-go':setMenu(false);go(Number(el.dataset.index));return;
 case 'part':{const i=Number(el.dataset.i),p=S.parts;const exists=p.selected.includes(i);p.selected=exists?p.selected.filter(x=>x!==i):[...p.selected,i].sort((a,b)=>a-b);announce(`Выбрано ${p.selected.length} из ${p.d} частей`);break;}
 case 'parts-d':S.parts={d,selected:Array.from({length:Math.min(S.parts.selected.length,d)},(_,i)=>i)};break;
 case 'parts-clear':S.parts.selected=[];break;
 case 'parts-all':S.parts.selected=Array.from({length:S.parts.d},(_,i)=>i);break;
 case 'share-preset':S.sharing={n,d,shown:false};break;
 case 'share':S.sharing.shown=true;break;
 case 'read-preset':S.reading={n,d};break;
 case 'multiply-preset':S.multiply={...S.multiply,n,d};break;
 case 'multiply-k':S.multiply.k=k;break;
 case 'divide-preset':S.divide={n,d,k:commonDivisors(n,d)[0]};break;
 case 'divide-k':S.divide.k=k;break;
 case 'reduce-preset':S.reduce={n,d,revealed:false,error:''};break;
 case 'reduce-reveal':S.reduce.revealed=true;break;
 case 'steps-preset':S.steps={n,d,history:[{n,d}]};break;
 case 'step-divide':{const st=S.steps,last=st.history[st.history.length-1];if(k>1&&last.n%k===0&&last.d%k===0)st.history.push({n:last.n/k,d:last.d/k,by:k});break;}
 case 'step-undo':if(S.steps.history.length>1)S.steps.history.pop();break;
 case 'step-reset':S.steps.history=[{n:S.steps.n,d:S.steps.d}];break;
 case 'practice-choice':if(S.practice.done[0])return;if(n===3&&d===8){S.practice.done[0]=true;feedback('Верно! Взяли 3 части из 8 равных частей.','good');}else feedback('Посчитай все равные части, а затем только закрашенные.','try');return;
 case 'practice-next':if(S.practice.index<2){S.practice.index++;S.practice.message='';S.practice.kind='';}else{go(9);return;}break;
 case 'practice-reset':S.practice={index:0,done:[false,false,false],message:'',kind:''};break;
 default:return;
 }render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='reduceForm'){
 const n=Number($('#reduceN').value),d=Number($('#reduceD').value);
 if(!Number.isInteger(n)||!Number.isInteger(d)||n<1||d<1||n>d||d>60){S.reduce.error='Введи целые числа: 1 ≤ числитель ≤ знаменатель ≤ 60.';$('.error').textContent=S.reduce.error;return;}
 S.reduce={n,d,revealed:false,error:''};render();
 }else if(e.target.id==='practiceForm'){
 const p=S.practice,n=Number($('#answerN')?.value),d=Number($('#answerD')?.value);
 if(p.done[p.index])return;
 if(p.index===1){if($('#answerN').value.trim()!==''&&n===8){p.done[1]=true;feedback('Верно! 3 × 4 = 12, поэтому 2 × 4 = 8.','good');}else feedback('Знаменатель умножили на 4. Умножь на 4 и числитель.','try');}
 if(p.index===2){if(n===3&&d===4){p.done[2]=true;feedback('Верно! НОД(18, 24) = 6. Получили три четвёртых.','good');}else if(Number.isInteger(n)&&Number.isInteger(d)&&n>0&&d>0&&n*24===d*18)feedback('Дробь равна исходной, но ещё сокращается. Найди общий делитель больше 1.','try');else feedback('Раздели и 18, и 24 на одно и то же число. Их НОД равен 6.','try');}
 }});
$('#backButton').addEventListener('click',()=>go(S.slide-1));$('#nextButton').addEventListener('click',()=>go(S.slide===9?0:S.slide+1));
$('#contentsButton').addEventListener('click',()=>setMenu(true));$('#closeMenu').addEventListener('click',()=>setMenu(false));$('#contents').addEventListener('click',e=>{if(e.target.id==='contents')setMenu(false);});
let toastTimer;
function toast(text){$('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),4500);}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else toast('Используйте полноэкранный режим браузера. На компьютере — F11.');}catch(e){toast('Используйте полноэкранный режим браузера. На компьютере — F11.');}}
$('#fullscreenButton').addEventListener('click',fullscreen);
document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;$('#fullscreenButton').setAttribute('aria-label',full?'Выйти из полного экрана':'На весь экран');$('#fullscreenButton').title=full?'Выйти из полного экрана':'На весь экран';});
document.addEventListener('keydown',e=>{
 if($('#contents').classList.contains('open')){if(e.key==='Escape'){e.preventDefault();setMenu(false);}else if(e.key==='Tab'){const els=$$('#contents button');const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if(e.target.closest('.piece.clickable')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();action(e.target.closest('.piece.clickable'));return;}
 if(e.key==='ArrowRight'){e.preventDefault();if(S.slide<9)go(S.slide+1);}else if(e.key==='ArrowLeft'){e.preventDefault();if(S.slide>0)go(S.slide-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(9);}else if((e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();fullscreen();}
});
render(true);
</script>
</body>
</html>
